name = "comparemalta"  # must match the Worker name in Cloudflare (Workers Builds deploys this folder)
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
SITE_URL = "https://comparemalta.ai"
ALLOWED_ORIGINS = "https://comparemalta.ai,https://www.comparemalta.ai,https://swordfishdigital.github.io"
MODEL = "claude-sonnet-5-5"

# Secret (set once, never committed):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CONTACT_WEBHOOK   (where partnership enquiries go, e.g. a Slack or Zapier webhook)
