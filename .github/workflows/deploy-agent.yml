name: deploy-agent
on:
  push:
    branches: [main]
    paths: ["agent/**"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AGENT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: agent
          secrets: |
            ANTHROPIC_API_KEY
            CONTACT_WEBHOOK
            NEWSLETTER_PROVIDER
            MAILCHIMP_API_KEY
            MAILCHIMP_LIST_ID
            BREVO_API_KEY
            BREVO_LIST_ID
            BREVO_DOI_TEMPLATE_ID
            NEWSLETTER_WEBHOOK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_WEBHOOK: ${{ secrets.CONTACT_WEBHOOK }}
          NEWSLETTER_PROVIDER: ${{ secrets.NEWSLETTER_PROVIDER }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_DOI_TEMPLATE_ID: ${{ secrets.BREVO_DOI_TEMPLATE_ID }}
          NEWSLETTER_WEBHOOK: ${{ secrets.NEWSLETTER_WEBHOOK }}
